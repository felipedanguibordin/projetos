<!doctype html>
<html>
  <head>
    <title>Resumo SO - PROVA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: Arial, sans-serif;
        color: #fff;
      }

      .pdf-icon {
        width: 80px;
        height: 100px;
        background: #e53935;
        border-radius: 4px 16px 4px 4px;
        position: relative;
        margin-bottom: 24px;
        box-shadow: 4px 4px 20px rgba(229, 57, 53, 0.4);
      }
      .pdf-icon::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 16px;
        height: 16px;
        background: #c62828;
        border-radius: 0 0 0 8px;
      }
      .pdf-icon::after {
        content: "PDF";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 2px;
      }

      .pages {
        position: absolute;
        bottom: -6px;
        left: 6px;
        width: 80px;
        height: 100px;
        background: #ef9a9a;
        border-radius: 4px 16px 4px 4px;
        z-index: -1;
      }
      .pages2 {
        position: absolute;
        bottom: -12px;
        left: 12px;
        width: 80px;
        height: 100px;
        background: #ffcdd2;
        border-radius: 4px 16px 4px 4px;
        z-index: -2;
      }

      .loading-text {
        font-size: 16px;
        color: #ccc;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      .progress-container {
        width: 280px;
        background: #333;
        border-radius: 100px;
        height: 8px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e53935, #ff7043);
        border-radius: 100px;
        transition: width 0.3s ease;
      }

      .percent-text {
        margin-top: 10px;
        font-size: 13px;
        color: #aaa;
      }

      .dots span {
        animation: blink 1.2s infinite;
        display: inline-block;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }

      #main-content {
        display: none;
        background-color: #000;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }

      .xande {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="pdf-icon">
        <div class="pages"></div>
        <div class="pages2"></div>
      </div>
      <div class="loading-text">
        Carregando documento<span class="dots"
          ><span>.</span><span>.</span><span>.</span></span
        >
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="percent-text" id="percent-text">0%</div>
    </div>

    <div id="main-content"></div>

    <script>
      const DURATION = 20000;
      const bar = document.getElementById("progress-bar");
      const percentText = document.getElementById("percent-text");
      const loading = document.getElementById("loading-screen");
      const main = document.getElementById("main-content");

      const start = Date.now();

      function tick() {
        const elapsed = Date.now() - start;
        const pct = Math.min(100, Math.round((elapsed / DURATION) * 100));
        bar.style.width = pct + "%";
        percentText.textContent = pct + "%";

        if (pct < 100) {
          requestAnimationFrame(tick);
        } else {
          setTimeout(() => {
            loading.style.transition = "opacity 0.6s";
            loading.style.opacity = "0";
            setTimeout(() => {
              loading.style.display = "none";
              main.style.display = "block";
              launchPage();
            }, 600);
          }, 200);
        }
      }
      requestAnimationFrame(tick);

      function launchPage() {
        for (let i = 0; i < 100; i++) {
          const xande = document.createElement("div");
          xande.className = "xande";
          xande.innerText = "XANDE";
          xande.style.top = `${Math.random() * 100}%`;
          xande.style.left = `${Math.random() * 100}%`;
          xande.style.fontSize = `${Math.random() * 50 + 10}px`;
          xande.style.color = `rgb(${Math.floor(Math.random() * 255)},${Math.floor(Math.random() * 255)},${Math.floor(Math.random() * 255)})`;
          main.appendChild(xande);
        }
      }
    </script>
  </body>
</html>
